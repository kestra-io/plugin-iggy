services:
  iggy:
    image: apache/iggy:0.8.0
    ports:
      - "8090:8090"
      - "3000:3000"
    cap_add:
      - SYS_NICE
    privileged: true
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - IGGY_NODE_ADVERTISED_ADDRESS=localhost
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
